name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Validate practice content
        run: python3 tests/content.py
      - name: Build frontend
        run: npm --prefix frontend run build
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 tests/smoke.py
      - run: python3 tests/accounts.py
      - run: python3 tests/practice.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        run: docker compose logs
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - if: always()
        run: docker compose down -v
