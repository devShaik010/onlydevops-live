name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Validate content JSON
        run: node -e "const fs=require('fs'); const syllabus=JSON.parse(fs.readFileSync('api/syllabus.json')); const challenges=JSON.parse(fs.readFileSync('api/challenges.json')); const topics=new Set(syllabus.map(t=>t.id)); if(challenges.some(c=>!topics.has(c.topic)||!c.options.some(o=>o.id===c.answer))) process.exit(1); console.log('Content OK')"
      - name: Check API syntax
        run: node --check 'api/[...path].js'
      - name: Test progress batching API
        run: node --test api/progress.test.cjs
      - name: Build frontend
        run: npm --prefix frontend run build
