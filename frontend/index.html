<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#101116" />
    <meta
      name="description"
      content="Learn practical DevOps with a guided command checklist and evidence-based troubleshooting challenges."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OnlyDevOps" />
    <meta property="og:title" content="OnlyDevOps — Learn by doing" />
    <meta
      property="og:description"
      content="A practical DevOps learning sheet with hands-on troubleshooting challenges."
    />
    <meta property="og:url" content="https://www.onlydevops.in/" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://www.onlydevops.in/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>OnlyDevOps — Your DevOps sheet</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem("onlydevops-theme"); } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>html { background: #101116; } html[data-theme="light"] { background: #f7f8fa; }</style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
